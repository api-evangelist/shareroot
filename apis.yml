name: ShareRoot
description: >-
  ShareRoot was a user-generated content (UGC) marketing platform and, as ShareRoot Ltd
  (ASX: SRO), an Australian listed group headquartered in St Kilda, Victoria. Its brands
  were the ShareRoot platform for legally acquiring, organising and displaying UGC and
  brand-ambassador content (social walls, Facebook tabs, contests, experiential galleries
  and UGC on product pages), The Social Science, a marketing agency for Australia's life
  sciences and health technology sectors, and Ludomade, a digital-experience studio doing
  web design, mobile games, VR/AR and experiential activations. Shareholders approved a
  rename to Opyl Limited (ASX: OPL) at the December 2019 annual general meeting, and the
  group repositioned into artificial intelligence for clinical trials and digital health;
  ludomade.com now redirects to opyl.ai. ShareRoot never published a developer program,
  API documentation, machine-readable specification or client SDK, and shareroot.co is now
  a stale legacy site sitting behind a bot challenge. This profile captures the company
  identity, a live domain-security probe, a recorded-absence well-known probe, and the two
  first-party open-source npm utilities the ShareRoot engineering team published in 2016.
