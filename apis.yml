name: ShareRoot
description: >-
  ShareRoot is an Australian digital marketing and technology company based in St
  Kilda, Victoria, that helps brands understand market opportunities and engage
  audiences across digital channels. It operates through several subsidiary
  brands: the ShareRoot platform for user-generated content (UGC) and brand
  ambassador programs (social walls, contests, and e-commerce optimization), The
  Social Science marketing agency focused on Australia's life sciences and health
  technology sectors, and Ludomade, which builds digital experiences spanning web
  design, mobile games, VR/AR, and experiential activations. ShareRoot publishes
  no public developer program, API documentation, or SDKs; this profile captures
  the company identity and a live domain-security probe for the API Evangelist
  network.
